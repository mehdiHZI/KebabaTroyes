services:
  caisse-api:
    build: .
    image: kebaba-caisse-api:latest
    container_name: kebaba-caisse-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATA_DIR: /data
      CAISSE_API_TOKEN: ${CAISSE_API_TOKEN:?set CAISSE_API_TOKEN}
    volumes:
      - caisse_api_data:/data
    networks:
      - proxy-net
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"
      - "traefik.http.routers.kebaba-caisse-api.rule=Host(`caisse-api.kebaba.fr`)"
      - "traefik.http.routers.kebaba-caisse-api.entrypoints=websecure"
      - "traefik.http.routers.kebaba-caisse-api.tls.certresolver=myresolver"
      - "traefik.http.services.kebaba-caisse-api.loadbalancer.server.port=8080"
      - "traefik.http.routers.kebaba-caisse-api-http.rule=Host(`caisse-api.kebaba.fr`)"
      - "traefik.http.routers.kebaba-caisse-api-http.entrypoints=web"
      - "traefik.http.routers.kebaba-caisse-api-http.middlewares=kebaba-caisse-https-redirect"
      - "traefik.http.middlewares.kebaba-caisse-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.kebaba-caisse-https-redirect.redirectscheme.permanent=true"

networks:
  proxy-net:
    external: true

volumes:
  caisse_api_data:
